name: verify-apply-sa

# Comprueba que una ejecución sobre refs/heads/main obtiene la SA `apply` por WIF.
# Es la mitad positiva de la prueba M4 de specs/bootstrap-plan.md; la negativa (un PR no
# la obtiene) ya se comprobó. No modifica infraestructura: solo se autentica y lee su identidad.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-apply-sa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-apply-sa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate as the apply SA
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.APPLY_SERVICE_ACCOUNT }}
          # Sin token_format la action solo escribe un archivo de credenciales y no llama a GCP:
          # la autenticación parecería correcta aunque la SA no se pudiera impersonar.
          token_format: access_token
          create_credentials_file: false
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/userinfo.email

      - name: Check the token belongs to the apply SA
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          EXPECTED: ${{ vars.APPLY_SERVICE_ACCOUNT }}
        run: |
          email=$(curl -sf -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            https://www.googleapis.com/oauth2/v3/userinfo | jq -r .email)
          echo "Authenticated as: ${email}"
          test "${email}" = "${EXPECTED}"
